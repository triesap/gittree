version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gittree
      POSTGRES_PASSWORD: gittree
      POSTGRES_DB: gittree
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    env_file:
      - .env
    environment:
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.relay
    env_file:
      - .env
    environment:
      GITTREE_RELAY_BIND: 0.0.0.0:8080
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admission:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admission
    env_file:
      - .env
    environment:
      GITTREE_ADMISSION_BIND: 0.0.0.0:8081
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  state:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.state
    env_file:
      - .env
    environment:
      GITTREE_STATE_BIND: 0.0.0.0:8082
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  coordinator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.coordinator
    env_file:
      - .env
    environment:
      GITTREE_COORDINATOR_BIND: 0.0.0.0:8083
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sync
    env_file:
      - .env
    environment:
      GITTREE_SYNC_BIND: 0.0.0.0:8084
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  git-http:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.git-http
    env_file:
      - .env
    environment:
      GITTREE_GIT_HTTP_BIND: 0.0.0.0:8085
      GITTREE_GIT_HTTP_UPSTREAM_URL: http://forgejo:3000/
    ports:
      - "8085:8085"
    depends_on:
      - relay
      - forgejo

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/forgejo.db
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: 2222
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data

  nginx:
    image: nginx:1.27
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - relay
      - git-http

volumes:
  pgdata: {}
  forgejo-data: {}
