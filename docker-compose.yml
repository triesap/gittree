services:
  log-init:
    image: alpine:3.20
    command:
      - "sh"
      - "-c"
      - "mkdir -p /logs/forgejo /logs/postgres /logs/nginx /logs/gittree && touch /logs/forgejo/forgejo.log && chmod -R 0777 /logs && chown -R 1000:1000 /logs/forgejo"
    volumes:
      - ./logs:/logs
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gittree
      POSTGRES_PASSWORD: gittree
      POSTGRES_DB: gittree
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_rotation_age=1d"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    depends_on:
      log-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    env_file:
      - .env
    environment:
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./logs:/var/log/gittree

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.relay
    env_file:
      - .env
    environment:
      GITTREE_RELAY_BIND: 0.0.0.0:8080
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8080:8080"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  admission:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admission
    env_file:
      - .env
    environment:
      GITTREE_ADMISSION_BIND: 0.0.0.0:8081
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8081:8081"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  state:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.state
    env_file:
      - .env
    environment:
      GITTREE_STATE_BIND: 0.0.0.0:8082
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8082:8082"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  coordinator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.coordinator
    env_file:
      - .env
    environment:
      GITTREE_COORDINATOR_BIND: 0.0.0.0:8083
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_FORGEJO_BASE_URL: http://forgejo:3000
      GITTREE_FORGEJO_API_TOKEN: ${GITTREE_FORGEJO_API_TOKEN}
      GITTREE_FORGEJO_OWNER: ${GITTREE_FORGEJO_OWNER}
      GITTREE_FORGEJO_WEBHOOK_URL: http://webhook:8087/
      GITTREE_FORGEJO_WEBHOOK_SECRET: ${GITTREE_FORGEJO_WEBHOOK_SECRET}
      GITTREE_FORGEJO_REPO_PRIVATE: ${GITTREE_FORGEJO_REPO_PRIVATE}
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8083:8083"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree
    networks:
      - default
      - internal

  sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sync
    env_file:
      - .env
    environment:
      GITTREE_SYNC_BIND: 0.0.0.0:8084
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8084:8084"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  webhook:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.webhook
    env_file:
      - .env
    environment:
      GITTREE_WEBHOOK_BIND: 0.0.0.0:8087
      GITTREE_SYNC_URL: http://sync:8084
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8087:8087"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sync:
        condition: service_started
    volumes:
      - ./logs:/var/log/gittree
    networks:
      - default
      - internal

  control:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.control
    env_file:
      - .env
    environment:
      GITTREE_CONTROL_BIND: 0.0.0.0:8088
      GITTREE_FORGEJO_BASE_URL: http://forgejo:3000
      GITTREE_FORGEJO_WEBHOOK_URL: http://webhook:8087/
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8088:8088"
    depends_on:
      log-init:
        condition: service_completed_successfully
      forgejo:
        condition: service_started
    volumes:
      - ./logs:/var/log/gittree
    networks:
      - default
      - internal

  ui:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ui
    env_file:
      - .env
    environment:
      GITTREE_UI_BIND: 0.0.0.0:8086
      GITTREE_UI_REPO_ROOT: /var/lib/gittree/repos
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8086:8086"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  git-http:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.git-http
    env_file:
      - .env
    environment:
      GITTREE_GIT_HTTP_BIND: 0.0.0.0:8085
      GITTREE_GIT_HTTP_UPSTREAM_URL: http://forgejo:3000/
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8085:8085"
    depends_on:
      log-init:
        condition: service_completed_successfully
      relay:
        condition: service_started
      forgejo:
        condition: service_started
    volumes:
      - ./logs:/var/log/gittree
    networks:
      - default
      - internal

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    env_file:
      - .env
    environment:
      FORGEJO__database__DB_TYPE: ${FORGEJO__database__DB_TYPE}
      FORGEJO__database__PATH: ${FORGEJO__database__PATH}
      FORGEJO__mailer__ENABLED: ${FORGEJO__mailer__ENABLED}
      FORGEJO__mailer__PROTOCOL: ${FORGEJO__mailer__PROTOCOL}
      FORGEJO__mailer__FROM: ${FORGEJO__mailer__FROM}
      FORGEJO__mailer__SMTP_ADDR: ${FORGEJO__mailer__SMTP_ADDR}
      FORGEJO__mailer__SMTP_PORT: ${FORGEJO__mailer__SMTP_PORT}
      FORGEJO__mailer__USER: ${FORGEJO__mailer__USER}
      FORGEJO__mailer__PASSWD: ${FORGEJO__mailer__PASSWD}
      FORGEJO__log__MODE: ${FORGEJO__log__MODE}
      FORGEJO__log__ROOT_PATH: ${FORGEJO__log__ROOT_PATH}
      FORGEJO__LOG_0X2E_FILE__FILE_NAME: ${FORGEJO__LOG_0X2E_FILE__FILE_NAME}
      FORGEJO__log__LEVEL: ${FORGEJO__log__LEVEL}
      FORGEJO__server__ROOT_URL: http://forgejo:3000/
      FORGEJO__server__DOMAIN: forgejo
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: forgejo
      FORGEJO__server__SSH_PORT: "22"
    expose:
      - "3000"
      - "22"
    volumes:
      - forgejo-data:/data
      - ./logs/forgejo:/data/gitea/log
    depends_on:
      log-init:
        condition: service_completed_successfully
    networks:
      - internal

  forgejo-init:
    image: codeberg.org/forgejo/forgejo:1.21
    user: "1000:1000"
    env_file:
      - .env
    depends_on:
      forgejo:
        condition: service_started
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        set -eu;
        until gitea admin user list --config /data/gitea/conf/app.ini >/tmp/users 2>/dev/null; do
          sleep 1;
        done;
        if grep -qE '^[[:space:]]*[0-9]+[[:space:]]+gittree[[:space:]]' /tmp/users; then
          exit 0;
        fi;
        gitea admin user create \
          --admin \
          --username "${FORGEJO_ADMIN_USERNAME}" \
          --password "${FORGEJO_ADMIN_PASSWORD}" \
          --email "${FORGEJO_ADMIN_EMAIL}" \
          --must-change-password=false \
          --config /data/gitea/conf/app.ini
    volumes:
      - forgejo-data:/data
    restart: "no"
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - default
      - internal

  nginx:
    image: nginx:1.27
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      log-init:
        condition: service_completed_successfully
      relay:
        condition: service_started
      git-http:
        condition: service_started

volumes:
  pgdata: {}
  forgejo-data: {}

networks:
  internal:
    internal: true
