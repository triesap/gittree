version: "3.9"

services:
  log-init:
    image: alpine:3.20
    command:
      - "sh"
      - "-c"
      - "mkdir -p /logs/forgejo /logs/postgres /logs/nginx /logs/gittree /logs/nostr-rs-relay && chmod -R 0777 /logs"
    volumes:
      - ./logs:/logs
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gittree
      POSTGRES_PASSWORD: gittree
      POSTGRES_DB: gittree
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
      - "-c"
      - "log_rotation_age=1d"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./logs/postgres:/var/log/postgresql
    depends_on:
      log-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    env_file:
      - .env
    environment:
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./logs:/var/log/gittree

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.relay
    env_file:
      - .env
    environment:
      GITTREE_RELAY_BIND: 0.0.0.0:8080
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8080:8080"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  admission:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admission
    env_file:
      - .env
    environment:
      GITTREE_ADMISSION_BIND: 0.0.0.0:8081
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8081:8081"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  state:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.state
    env_file:
      - .env
    environment:
      GITTREE_STATE_BIND: 0.0.0.0:8082
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8082:8082"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  coordinator:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.coordinator
    env_file:
      - .env
    environment:
      GITTREE_COORDINATOR_BIND: 0.0.0.0:8083
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8083:8083"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  sync:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.sync
    env_file:
      - .env
    environment:
      GITTREE_SYNC_BIND: 0.0.0.0:8084
      GITTREE_STORAGE_READ_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_STORAGE_WRITE_URL: postgres://gittree:gittree@postgres:5432/gittree
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8084:8084"
    depends_on:
      log-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/var/log/gittree

  git-http:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.git-http
    env_file:
      - .env
    environment:
      GITTREE_GIT_HTTP_BIND: 0.0.0.0:8085
      GITTREE_GIT_HTTP_UPSTREAM_URL: http://forgejo:3000/
      GITTREE_LOG_DIR: /var/log/gittree
      GITTREE_LOG_STDOUT: "true"
    ports:
      - "8085:8085"
    depends_on:
      log-init:
        condition: service_completed_successfully
      relay:
        condition: service_started
      forgejo:
        condition: service_started
    volumes:
      - ./logs:/var/log/gittree

  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/forgejo.db
      FORGEJO__log__MODE: file
      FORGEJO__log__ROOT_PATH: /data/gitea/log
      FORGEJO__log__LEVEL: Info
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__SSH_DOMAIN: localhost
      FORGEJO__server__SSH_PORT: 2222
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data
      - ./logs/forgejo:/data/gitea/log
    depends_on:
      log-init:
        condition: service_completed_successfully

  nostr-rs-relay:
    image: scsibug/nostr-rs-relay:latest
    environment:
      RUST_LOG: "info,nostr_rs_relay=debug"
    ports:
      - "7080:8080"
    volumes:
      - nostr-rs-relay-db:/usr/src/app/db
      - ./deploy/nostr-rs-relay/config.toml:/usr/src/app/config.toml:ro
      - ./logs/nostr-rs-relay:/usr/src/app/logs
    depends_on:
      log-init:
        condition: service_completed_successfully
    restart: "no"

  nginx:
    image: nginx:1.27
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      log-init:
        condition: service_completed_successfully
      relay:
        condition: service_started
      git-http:
        condition: service_started

volumes:
  pgdata: {}
  forgejo-data: {}
  nostr-rs-relay-db: {}
