[package]
name = "gittree-app-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["hydrate"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_router/ssr", "axum", "gittree-core", "gittree-storage"]

[dependencies]
leptos.workspace = true
leptos_router.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
hex.workspace = true
web-sys.workspace = true

axum = { version = "0.8", optional = true }
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

mf2-i18n-core.workspace = true
mf2-i18n-embedded.workspace = true

ui-primitives = { path = "../../refs/ui-primitives/crates/ui-primitives", features = ["core", "leptos"] }

gittree-app-core = { path = "../app-core" }
gittree-core = { path = "../core", optional = true }
gittree-storage = { path = "../storage", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
