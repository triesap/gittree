[package]
name = "gittree-storage"
version = "0.1.0"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
gittree-core = { path = "../core" }
hex = "0.4"
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time"] }
time = "0.3"

[dev-dependencies]
serde = { workspace = true }
tokio = { version = "1", features = ["macros", "rt"] }
