[package]
name = "gittree-storage"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
gittree-core = { path = "../core" }
hex = "0.4"
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
