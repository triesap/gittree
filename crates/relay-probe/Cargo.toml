[package]
name = "gittree-relay-probe"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gittree-relay-probe"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15"
gittree-config = { path = "../config" }
gittree-core = { path = "../core" }
gittree-relay-adapter = { path = "../relay-adapter" }
gittree-storage = { path = "../storage" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
async-trait = "0.1"
once_cell = "1"
