[package]
name = "gittree-dispatch"
version = "0.1.0"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
futures-util = "0.3"
gittree-app-core = { path = "../../crates/app-core" }
gittree-core = { path = "../../crates/core" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = "0.24"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
