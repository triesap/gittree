[package]
name = "gittree-dispatch"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
gittree-observability = { path = "../../crates/observability" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
