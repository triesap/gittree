[package]
name = "gittree-dispatch"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
gittree-app-core = { path = "../../crates/app-core" }
gittree-core = { path = "../../crates/core" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
