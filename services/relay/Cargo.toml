[package]
name = "gittree-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
gittree-config = { path = "../../crates/config" }
gittree-core = { path = "../../crates/core" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
secp256k1 = { version = "0.29", features = ["rand-std"] }
sha2 = "0.10"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
opentelemetry = { version = "0.23", features = ["metrics"] }

[dev-dependencies]
tower = "0.5"
tokio-tungstenite = "0.23"
