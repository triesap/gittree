[package]
name = "gittree-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
bech32 = "0.11"
gittree-config = { path = "../../crates/config" }
gittree-core = { path = "../../crates/core" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower = "0.4"
