[package]
name = "gittree-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
base64 = "0.22"
dotenvy = "0.15"
gittree-config = { path = "../../crates/config" }
gittree-app-core = { path = "../../crates/app-core" }
gittree-forgejo = { path = "../../crates/forgejo" }
gittree-nostr-auth = { path = "../../crates/nostr-auth" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
async-trait = "0.1"
secp256k1 = "0.29"
tower = "0.4"
