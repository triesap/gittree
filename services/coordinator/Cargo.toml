[package]
name = "gittree-coordinator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
gittree-config = { path = "../../crates/config" }
gittree-core = { path = "../../crates/core" }
gittree-observability = { path = "../../crates/observability" }
gittree-relay-adapter = { path = "../../crates/relay-adapter" }
gittree-storage = { path = "../../crates/storage" }
gittree-forgejo = { path = "../../crates/forgejo" }
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.23"
tower = "0.4"
