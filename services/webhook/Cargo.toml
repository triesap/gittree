[package]
name = "gittree-webhook"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.7"
dotenvy = "0.15"
gittree-config = { path = "../../crates/config" }
gittree-git-hook = { path = "../git-hook" }
gittree-observability = { path = "../../crates/observability" }
gittree-storage = { path = "../../crates/storage" }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"

[dev-dependencies]
gittree-core = { path = "../../crates/core" }
hmac = "0.12"
sha2 = "0.10"
tower = "0.4"
