[package]
name = "gittree-git-hook"
version = "0.1.0"
edition = "2024"

[dependencies]
gittree-config = { path = "../../crates/config" }
gittree-core = { path = "../../crates/core" }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
