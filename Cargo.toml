[workspace]
members = [
  "crates/app-core",
  "crates/app-ui",
  "crates/app-ui/src-tauri",
  "crates/forgejo",
  "crates/config",
  "crates/observability",
  "crates/nostr-auth",
  "crates/core",
  "crates/storage",
  "crates/relay-adapter",
  "crates/relay-probe",
  "crates/migrate",
  "services/admin",
  "services/admission",
  "services/app",
  "services/auth",
  "services/control",
  "services/coordinator",
  "services/git-hook",
  "services/git-http",
  "services/relay",
  "services/state",
  "services/sync",
  "services/ui",
  "services/webhook",
]
exclude = ["refs/ui-primitives"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92.0"
license = "Unlicense"
homepage = "https://github.com/triesap/gittree"
repository = "https://github.com/triesap/gittree.git"
version = "0.1.0"
readme = "README.md"
authors = ["triesap npub1tr33s4tj2le2kk9yzhfphdtss26gyn8kv7savnnjhj794nqp333q8e7grr"]

[workspace.metadata]
authors = ["triesap npub1tr33s4tj2le2kk9yzhfphdtss26gyn8kv7savnnjhj794nqp333q8e7grr"]
description = "Git Nostr relay and GRASP services (NIP-34)"
readme = "README.md"
repository = "https://github.com/triesap/gittree"
license-file = "LICENSE"
keywords = ["nostr", "git", "nip-34", "grasp", "relay"]

[workspace.dependencies]
leptos = { version = "0.8.5", default-features = false }
leptos_router = { version = "0.8.5", default-features = false }
leptos_axum = { version = "0.8.5" }
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
futures = "0.3"
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2" }
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
  "Window",
  "Crypto",
  "Document",
  "Element",
  "HtmlElement",
  "Headers",
  "NodeList",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "Url",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1.8", features = ["v4", "v7", "js"] }
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
mf2-i18n-core = { git = "https://github.com/triesap/mf2-i18n", rev = "989e5826fe235788e6c13418d248487db5c3aaca" }
mf2-i18n-embedded = { git = "https://github.com/triesap/mf2-i18n", rev = "989e5826fe235788e6c13418d248487db5c3aaca" }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
